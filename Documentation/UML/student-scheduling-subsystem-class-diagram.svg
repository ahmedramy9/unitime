<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">Student Scheduling / Online Sectioning subsystem class diagram</title>
  <desc id="desc">A UML-style class diagram reverse-engineered from UniTime's Student Scheduling and Online Sectioning packages, showing GWT service classes, online sectioning actions, solver services, DAOs, and persistent model relationships.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d405b"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 11 5 L 1 1 L 1 9 z" fill="#ffffff" stroke="#3d405b" stroke-width="1.4"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #272932; }
      .subtitle { font: 13px Arial, Helvetica, sans-serif; fill: #5b5f6a; }
      .pkg { fill: #fbfbf8; stroke: #9a9a8f; stroke-width: 1.4; rx: 8; }
      .pkgtitle { font: 700 16px Arial, Helvetica, sans-serif; fill: #272932; }
      .class { fill: #f7f7f2; stroke: #3d405b; stroke-width: 1.35; rx: 5; }
      .iface { fill: #e8f1f2; stroke: #3d405b; stroke-width: 1.35; rx: 5; }
      .service { fill: #fff3d8; stroke: #3d405b; stroke-width: 1.35; rx: 5; }
      .model { fill: #edf6ea; stroke: #3d405b; stroke-width: 1.35; rx: 5; }
      .highlight { fill: #f7e9ef; stroke: #3d405b; stroke-width: 1.35; rx: 5; }
      .name { font: 700 14px Arial, Helvetica, sans-serif; fill: #272932; }
      .stereo { font: 11px Arial, Helvetica, sans-serif; fill: #5b5f6a; }
      .member { font: 12px Consolas, "Courier New", monospace; fill: #454954; }
      .tiny { font: 11px Arial, Helvetica, sans-serif; fill: #5b5f6a; }
      .rel { stroke: #3d405b; stroke-width: 1.35; fill: none; marker-end: url(#arrow); }
      .impl { stroke: #3d405b; stroke-width: 1.35; fill: none; stroke-dasharray: 6 5; marker-end: url(#tri); }
      .inherit { stroke: #3d405b; stroke-width: 1.35; fill: none; marker-end: url(#tri); }
      .assoc { stroke: #4f5668; stroke-width: 1.15; fill: none; marker-end: url(#arrow); }
      .mult { font: 11px Arial, Helvetica, sans-serif; fill: #272932; }
    </style>
  </defs>

  <rect width="1500" height="1120" fill="#ffffff"/>
  <text class="title" x="44" y="48">Student Scheduling / Online Sectioning Subsystem UML</text>
  <text class="subtitle" x="44" y="72">Reverse-engineered from SectioningServlet, GwtRpcServlet, SectioningReportsBackend, OnlineSectioningServer/Action, DAO imports, Hibernate mappings, and generated base model annotations.</text>

